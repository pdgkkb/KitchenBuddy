<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Bite</title>
  <meta name="description" content="What's for dinner, from what's already in the kitchen.">
  <meta name="theme-color" content="#F6F5F0">
  <link rel="preload" href="/assets/figtree-latin-wght-normal-D_ZTVpCC.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/catalog-corpus-DHkYgvMN.json" as="fetch" crossorigin>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- ================================================================
       LOADING SCREEN — critical CSS.
       Inline on purpose: it has to paint before any stylesheet, font or
       script arrives. Colours are literal copies of tokens.css and icon.svg
       (the tokens aren't loaded yet). Everything that moves is transform,
       opacity or a dash — no layout, no paint storms.

       The app's own mark, turning. The ring closes into a full circle the
       moment the app says it is ready, so the animation ends where the wait
       ends. (The pot that used to be here now waits with you while a recipe
       is written: components/Waiting.jsx.)
       ================================================================ -->
  <style>
    html,body{margin:0;background:#F6F5F0;color:#1B2620;font:450 20px/1.45 "Figtree Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

    .hb-loader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:#F6F5F0;
      transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1)}
    /* soft brand light behind the mark; painted once, never animated */
    .hb-loader::before{content:"";position:absolute;inset:-20%;pointer-events:none;
      background:radial-gradient(34% 30% at 30% 34%,rgba(43,192,142,.20),transparent 70%),
                 radial-gradient(30% 28% at 70% 66%,rgba(34,179,214,.14),transparent 70%),
                 radial-gradient(26% 24% at 62% 26%,rgba(245,165,36,.13),transparent 70%)}
    .hb-loader.is-leaving{opacity:0;transform:scale(1.015);pointer-events:none}

    .hb-loader-card{position:relative;display:grid;justify-items:center;gap:10px;padding:28px 32px;text-align:center}

    /* ---- the logo: the ring from icon.svg, turning ---------------------
       The arc closes into a full circle when the app is ready. That IS the
       finish; there is no bar pretending to know how far along it is. */
    .hb-mark{width:96px;height:96px;display:block;transition:transform .45s cubic-bezier(.16,1,.3,1)}
    .hb-ring{transform-origin:50% 50%;animation:hb-turn 1.5s cubic-bezier(.65,0,.35,1) infinite}
    .hb-arc{transition:stroke-dasharray .5s cubic-bezier(.16,1,.3,1)}
    .hb-core{transform-origin:50% 50%;animation:hb-breathe 2s ease-in-out infinite}
    .hb-loader.is-full .hb-mark{transform:scale(1.06)}
    .hb-loader.is-full .hb-arc{stroke-dasharray:196 0}
    .hb-loader.is-full .hb-ring{animation-duration:.9s}
    .hb-loader.is-full .hb-core{animation:none}

    .hb-name{margin:8px 0 0;font-weight:820;font-size:26px;letter-spacing:-.02em;color:#101A15}
    .hb-note{margin:0;font-size:16px;font-weight:550;color:#505B52}

    @keyframes hb-turn{to{transform:rotate(360deg)}}
    @keyframes hb-breathe{50%{transform:scale(.88);opacity:.9}}

    /* Reduced motion: the ring does not turn. It still closes when the app is
       ready, because that is information rather than decoration. */
    @media (prefers-reduced-motion:reduce){
      .hb-loader,.hb-mark{transition:none}
      .hb-ring,.hb-core{animation:none}
      .hb-arc{stroke-dasharray:120 76}
      .hb-loader.is-full .hb-arc{stroke-dasharray:196 0}
    }
  </style>
  <script type="module" crossorigin src="/assets/index-D3gxov5s.js"></script>
  <link rel="preload" as="style" crossorigin href="/assets/index-CSYSErYD.css" data-app-css onload="this.onload=null;this.rel='stylesheet'">
</head>
<body>
  <!-- ================================================================
       LOADING SCREEN — markup. A sibling of #root, so React never touches
       it; the script below removes it once the page and the app are ready.
       ================================================================ -->
  <div class="hb-loader" id="hb-loader" role="status" aria-live="polite">
    <div class="hb-loader-card">
      <svg class="hb-mark" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="48" cy="48" r="31" fill="none" stroke="#DDEAE6" stroke-width="9"/>
        <g class="hb-ring">
          <circle class="hb-arc" cx="48" cy="48" r="31" fill="none" stroke="#34C99A" stroke-width="9"
                  stroke-linecap="round" stroke-dasharray="60 136" transform="rotate(-90 48 48)"/>
        </g>
        <circle class="hb-core" cx="48" cy="48" r="17" fill="#12302A"/>
      </svg>
      <p class="hb-name">Happy Bite</p>
      <p class="hb-note" id="hb-note">Opening your kitchen…</p>
    </div>
  </div>

  <div id="root"></div>

  <!-- ================================================================
       LOADING SCREEN — hook. Plain JS, no dependencies, not render-blocking
       (it only registers listeners). The loader leaves when BOTH are true:
         1. window "load" has fired (fonts, styles, scripts are in), and
         2. the app has said it is ready — App.jsx calls window.hbReady()
            once the kitchen is read, so the loader never reveals a
            half-built screen.
       A 15 s failsafe removes it regardless, so a failure is never hidden
       behind a spinner forever.
       ================================================================ -->
  <script>
    (function () {
      var el = document.getElementById("hb-loader"), note = document.getElementById("hb-note");
      var loaded = document.readyState === "complete", ready = false, gone = false;
      var born = Date.now(), MIN_MS = 900;           // never a blink: the ring closes, then leaves

      function leave() {
        if (gone || !el) return;
        gone = true;
        el.classList.add("is-full");                 // close the ring, then go
        if (note) note.textContent = "Ready";
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        var wait = reduce ? 0 : 520;
        setTimeout(function () {
          if (reduce) { el.remove(); return; }
          el.classList.add("is-leaving");
          el.addEventListener("transitionend", function () { el.remove(); }, { once: true });
          setTimeout(function () { el.remove(); }, 700);   // if transitionend never fires
        }, wait);
      }
      function check() {
        if (!loaded || !ready) return;
        var left = MIN_MS - (Date.now() - born);
        left > 0 ? setTimeout(leave, left) : leave();
      }

      window.hbReady = function () { ready = true; check(); };
      window.addEventListener("load", function () {
        loaded = true;
        check();
      }, { once: true });
      setTimeout(leave, 15000);                      // a failure is never hidden behind a spinner
    })();
  </script>
</body>
</html>
